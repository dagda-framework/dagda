name: Linux checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-checks:
    name: Linux x86_64 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install SDL3, FreeType, a font, and the WebAssembly linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl3-dev libfreetype-dev fonts-liberation fonts-nanum lld

      - name: Install the pinned Odin compiler
        run: bash scripts/setup-odin.sh

      - name: Run the canvas slide unit tests
        run: ./scripts/odin.sh test examples/canvas-slide -collection:dagda=.

      - name: Link a js_wasm32 consumer of Dagda core
        run: |
          ./scripts/odin.sh build tests/js-wasm32-consumer -collection:dagda=. -target:js_wasm32 -out:"$RUNNER_TEMP/dagda-consumer.wasm"
          test -s "$RUNNER_TEMP/dagda-consumer.wasm"

      - name: Run the first-app guide smoke test
        run: python3 tests/docs/first_app_smoke.py

      - name: Run the Odin test suites
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./scripts/odin.sh test dagda -collection:dagda=.
          ./scripts/odin.sh test dagda/driver -collection:dagda=.
          ./scripts/odin.sh test dagda/sdlhost -collection:dagda=.
          ./scripts/odin.sh test examples/title-model -collection:dagda=.
          ./scripts/odin.sh test examples/title-driver -collection:dagda=.
          ./scripts/odin.sh test examples/title-window -collection:dagda=.
          ./scripts/odin.sh test examples/shared-text -collection:dagda=.
          ./scripts/odin.sh test examples/multiline-text -collection:dagda=.
          ./scripts/odin.sh test examples/paragraph-interleaving -collection:dagda=.
          ./scripts/odin.sh test examples/action-origin -collection:dagda=.

      - name: Build the title window and counter example
        run: |
          mkdir -p build
          ./scripts/odin.sh build examples/title-window -collection:dagda=. -out:build/title-window
          ./scripts/odin.sh build examples/counter -collection:dagda=. -out:build/counter
          ./scripts/odin.sh build examples/canvas-slide -collection:dagda=. -out:build/canvas-slide
          ./scripts/odin.sh build examples/dagda-client -collection:dagda=. -out:build/dagda-client

      - name: Check the shared-title example output
        run: |
          ./scripts/odin.sh run examples/shared-title -collection:dagda=. > actual.txt
          awk '/^```text$/{flag=1; next} /^```$/{if (flag) exit} flag' README.md > expected.txt
          diff -u expected.txt actual.txt

      - name: Run the title driver end-to-end test
        run: python3 examples/title-driver/tests/e2e_test.py

      - name: Run the advertised edits end-to-end test
        run: python3 examples/advertised-edit-app/tests/e2e_test.py

      - name: Run the visible canvas bounds client test
        run: python3 dagda/driver/tests/visible_bounds_test.py

      - name: Run the hit-test client test
        run: python3 dagda/driver/tests/hit_test_test.py

      - name: Run the worker rebuild acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/worker-rebuild/tests/acceptance_test.py

      - name: Run the rect edits window test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/rect-app/tests/e2e_rect_edits.py

      - name: Run the native counter acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/counter/tests/acceptance_test.py build/counter-capture

      - name: Run the agent preview acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/canvas-slide/tests/agent_preview_acceptance.py

      - name: Run the native canvas acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/canvas-slide/tests/acceptance_test.py build/canvas-capture

      - name: Run the shared-text multi-element test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/shared-text/tests/e2e_shared_text.py build/shared-text-capture

      - name: Run the multiline text acceptance test
        env:
          MULTILINE: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/multiline-text/tests/e2e_multiline_text.py

      - name: Run the composition conflict test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/composition-conflict/tests/e2e_composition_conflict.py build/conflict-capture

      - name: Run the paragraph interleaving test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/paragraph-interleaving/tests/e2e_paragraph_interleaving.py

      - name: Run the title edit conflict test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/title-window/tests/e2e_title_conflict.py

      - name: Run the application key test
        run: python3 examples/app-keys/tests/e2e_app_keys.py

      - name: Run the action origin test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/action-origin/tests/e2e_action_origin.py

      - name: Run the menu bar acceptance test
        env:
          MENUS: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/menu-bar/tests/e2e_menu_bar.py

      - name: Run the slide context menu acceptance test
        env:
          MENUS: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/slide-menu/tests/e2e_slide_menu.py

  macos-arm64-checks:
    name: macOS ARM64 counter
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log runner architecture and system
        run: |
          echo "arch: $(uname -m)"
          sw_vers
          uname -a

      - name: Install SDL3 and FreeType
        run: brew install sdl3 freetype

      - name: Install the pinned Odin compiler
        run: |
          bash scripts/setup-odin.sh
          ./scripts/odin.sh version
          echo "compiler: $(./scripts/odin.sh version)"

      - name: Run the first-app guide smoke test
        run: python3 tests/docs/first_app_smoke.py

      - name: Run the SDL host test suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./scripts/odin.sh test dagda/sdlhost -collection:dagda=.

      - name: Run the macOS shortcuts process check
        run: python3 examples/shared-text/tests/macos_shortcuts_test.py

      - name: Run the Cocoa caret and grapheme hit-test probe
        run: python3 examples/shared-text/tests/cocoa_caret_probe.py --require-driver cocoa

      - name: Run the Cocoa caret probe with native macOS CGEvent pointer clicks
        run: python3 examples/shared-text/tests/cocoa_caret_probe.py --require-driver cocoa --input-mode native

  windows-x64-checks:
    name: Windows x64 core
    runs-on: windows-2025
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log runner architecture and system
        shell: pwsh
        run: |
          Write-Host "arch: $env:PROCESSOR_ARCHITECTURE"
          [System.Environment]::OSVersion | Format-List

      - name: Install the pinned Odin compiler
        shell: pwsh
        run: |
          & ./scripts/setup-odin.ps1
          & ./scripts/odin.ps1 version

      - name: Run the Dagda core unit suite
        shell: pwsh
        run: '& ./scripts/odin.ps1 test dagda "-collection:dagda=."'

      - name: Test Windows local driver transport
        shell: pwsh
        run: |
          $pin = (Get-Content -Raw dagda.lock | ConvertFrom-Json).platforms.'windows-amd64'
          $env:ODIN = (Resolve-Path ".tools/odin-$($pin.version)/odin.exe").Path
          python dagda/driver/tests/windows_transport_test.py

      - name: Cache vcpkg SDL3 and FreeType
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed\x64-windows
          key: windows-2025-vcpkg-sdl3-freetype-v1

      - name: Install SDL3 and FreeType (vcpkg)
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\installed\x64-windows\lib\SDL3.lib') -or -not (Test-Path 'C:\vcpkg\installed\x64-windows\lib\freetype.lib')) {
            & C:\vcpkg\vcpkg.exe install sdl3:x64-windows freetype:x64-windows
          }

      - name: Verify FreeType struct layout against Windows headers
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (echo Visual Studio not found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python -c "open('ft_check.c','w').write('#include <stddef.h>\n#include <stdio.h>\n#include <ft2build.h>\n#include FT_FREETYPE_H\nint main(void){\n#define CHK(e) if(!(e)){fprintf(stderr,\"FAIL: %s\\n\",#e);return 1;}\nCHK(sizeof(FT_Bitmap)==40);\nCHK(offsetof(FT_Bitmap,buffer)==16);\nCHK(offsetof(FT_Bitmap,pixel_mode)==26);\nCHK(sizeof(FT_Size_Metrics)==28);\nCHK(offsetof(FT_Size_Metrics,ascender)==12);\nCHK(sizeof(FT_SizeRec)==64);\nCHK(offsetof(FT_SizeRec,metrics)==24);\nCHK(sizeof(FT_GlyphSlotRec)==248);\nCHK(offsetof(FT_GlyphSlotRec,advance)==88);\nCHK(offsetof(FT_GlyphSlotRec,bitmap)==104);\nCHK(offsetof(FT_GlyphSlotRec,bitmap_left)==144);\nCHK(offsetof(FT_GlyphSlotRec,bitmap_top)==148);\nCHK(sizeof(FT_FaceRec)==216);\nCHK(offsetof(FT_FaceRec,glyph)==120);\nCHK(offsetof(FT_FaceRec,size)==128);\nprintf(\"Windows FreeType layout verified\\n\");return 0;}\n')" || exit /b 1
          cl /nologo /I"C:\vcpkg\installed\x64-windows\include" ft_check.c /Fe:ft_check.exe || exit /b 1
          ft_check.exe || exit /b 1
          del ft_check.c ft_check.obj ft_check.exe

      - name: Run the native counter acceptance test on Windows
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $pin = (Get-Content -Raw dagda.lock | ConvertFrom-Json).platforms.'windows-amd64'
          $env:ODIN = (Resolve-Path ".tools/odin-$($pin.version)/odin.exe").Path
          $env:LIB = "C:\vcpkg\installed\x64-windows\lib;$env:LIB"
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          python examples/counter/tests/acceptance_test.py build/counter-capture-win
