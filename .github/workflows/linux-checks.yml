name: Linux checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-checks:
    name: Linux x86_64 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install SDL3, FreeType, a font, and the WebAssembly linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl3-dev libfreetype-dev fonts-liberation lld

      - name: Install the pinned Odin compiler
        run: bash scripts/setup-odin.sh

      - name: Run the canvas slide unit tests
        run: ./scripts/odin.sh test examples/canvas-slide -collection:dagda=.

      - name: Link a js_wasm32 consumer of Dagda core
        run: |
          ./scripts/odin.sh build tests/js-wasm32-consumer -collection:dagda=. -target:js_wasm32 -out:"$RUNNER_TEMP/dagda-consumer.wasm"
          test -s "$RUNNER_TEMP/dagda-consumer.wasm"

      - name: Run the first-app guide smoke test
        run: python3 tests/docs/first_app_smoke.py

      - name: Run the Odin test suites
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./scripts/odin.sh test dagda -collection:dagda=.
          ./scripts/odin.sh test dagda/driver -collection:dagda=.
          ./scripts/odin.sh test dagda/sdlhost -collection:dagda=.
          ./scripts/odin.sh test examples/title-model -collection:dagda=.
          ./scripts/odin.sh test examples/title-driver -collection:dagda=.
          ./scripts/odin.sh test examples/title-window -collection:dagda=.
          ./scripts/odin.sh test examples/shared-text -collection:dagda=.

      - name: Build the title window and counter example
        run: |
          mkdir -p build
          ./scripts/odin.sh build examples/title-window -collection:dagda=. -out:build/title-window
          ./scripts/odin.sh build examples/counter -collection:dagda=. -out:build/counter
          ./scripts/odin.sh build examples/canvas-slide -collection:dagda=. -out:build/canvas-slide
          ./scripts/odin.sh build examples/dagda-client -collection:dagda=. -out:build/dagda-client

      - name: Check the shared-title example output
        run: |
          ./scripts/odin.sh run examples/shared-title -collection:dagda=. > actual.txt
          awk '/^```text$/{flag=1; next} /^```$/{if (flag) exit} flag' README.md > expected.txt
          diff -u expected.txt actual.txt

      - name: Run the title driver end-to-end test
        run: python3 examples/title-driver/tests/e2e_test.py

      - name: Run the advertised edits end-to-end test
        run: python3 examples/advertised-edit-app/tests/e2e_test.py

      - name: Run the visible canvas bounds client test
        run: python3 dagda/driver/tests/visible_bounds_test.py

      - name: Run the rect edits window test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/rect-app/tests/e2e_rect_edits.py

      - name: Run the native counter acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/counter/tests/acceptance_test.py build/counter-capture

      - name: Run the agent preview acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/canvas-slide/tests/agent_preview_acceptance.py

      - name: Run the native canvas acceptance test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/canvas-slide/tests/acceptance_test.py build/canvas-capture

      - name: Run the shared-text multi-element test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/shared-text/tests/e2e_shared_text.py build/shared-text-capture

      - name: Run the composition conflict test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/composition-conflict/tests/e2e_composition_conflict.py build/conflict-capture

      - name: Run the title edit conflict test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python3 examples/title-window/tests/e2e_title_conflict.py
