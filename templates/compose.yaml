services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: dagda
      POSTGRES_PASSWORD: dagda-development-only
      POSTGRES_DB: __APP_NAME__
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagda -d __APP_NAME__"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
